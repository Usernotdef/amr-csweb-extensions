name: AmrStream Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amrstream-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Build AmrStream only
        run: ./gradlew :AmrStream:make --no-daemon --stacktrace

      - name: Save extension package
        uses: actions/upload-artifact@v6
        with:
          name: AmrStream-test-package
          path: '**/AmrStream.cs3'
          if-no-files-found: error
          retention-days: 7
